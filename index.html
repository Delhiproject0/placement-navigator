    <!--
      ADK DEV branding, the same marks the portfolio uses. There was no icon
      link at all before, so browsers fell back to guessing /favicon.ico - which
      happened to work, but meant no control over the dark-theme variant and no
      apple-touch icon at all.

      The media queries pick the cut that reads against the browser chrome:
      the brand purple disappears into a dark tab strip, so that gets the white
      one.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/adk-mark-color.png" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/adk-mark-light.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/adk-mark-color.png" />
    <meta name="theme-color" content="#4a2166" />
