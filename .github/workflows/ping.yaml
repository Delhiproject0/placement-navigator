name: Ping Supabase to Prevent Pausing

# Free-tier projects pause after a week of inactivity. This keeps the project
# warm by making one real query twice a week.
#
# Either key works, and that is deliberate rather than lazy. This repository is
# forked, and the two copies were set up years apart with different secrets:
# upstream has SUPABASE_SERVICE_ROLE_KEY (since 2025-12), the fork has
# SUPABASE_ANON_KEY (since 2026-08). An earlier rewrite of this file read only
# the anon key, which fixed the fork - failing every run since 2026-03 because
# it had no secrets at all - and broke upstream, which had been green until the
# change landed on its default branch. Accepting either means neither copy
# depends on which secret its owner happened to add.
#
# The call is `keepalive()`, a function that returns `true` and nothing else.
# It used to read one company id, but the site is internal now and the anon key
# can no longer read any table - which is the point, since that key ships in the
# browser bundle. The function still runs inside Postgres, so a 200 with `true`
# proves the database answered, which the bare /rest/v1/ root never did: that
# returns a body even for a project that no longer exists.

on:
  schedule:
    # 09:00 UTC on Monday and Thursday
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::The SUPABASE_URL repository secret is not set." >&2
            exit 1
          fi

          # The anon key is preferred: this only needs to call one harmless
          # function, and reaching for the service role to do that would hand
          # the job more authority than the task warrants.
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            key="${SUPABASE_ANON_KEY}"
            echo "Authenticating with SUPABASE_ANON_KEY."
          elif [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            key="${SUPABASE_SERVICE_ROLE_KEY}"
            echo "Authenticating with SUPABASE_SERVICE_ROLE_KEY (no anon key set)."
          else
            echo "::error::Set either SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY as a repository secret." >&2
            exit 1
          fi

          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
            -H "apikey: ${key}" \
            -H "Authorization: Bearer ${key}" \
            -H "Content-Type: application/json" \
            -d '{}')

          if [ "${status}" != "200" ]; then
            echo "::error::Expected HTTP 200, got ${status}." >&2
            cat response.json >&2
            exit 1
          fi

          # A literal `true` is the only body that proves Postgres ran the
          # function, rather than PostgREST returning an error object.
          jq -e '. == true' response.json > /dev/null

          echo "Ping OK: the database answered."
