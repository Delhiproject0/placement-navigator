name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test -- --run

      # The build only needs these to be present and well-formed - it never
      # talks to Supabase - so dummies keep the real project out of CI.
      - run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: ci
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

  functions:
    name: Typecheck edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --config is not optional. Deno looks for its config relative to the
      # working directory, so a deno.json further down the tree is never found
      # from the repo root; without it Deno falls back to the frontend's
      # package.json, switches to manual node_modules resolution, and dies on
      # supabase-js's transitive npm dependencies.
      - run: deno check --config supabase/functions/deno.json supabase/functions/placements/index.ts
