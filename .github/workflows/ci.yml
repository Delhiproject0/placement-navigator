name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test -- --run

      # The build only needs these to be present and well-formed - it never
      # talks to Supabase - so dummies keep the real project out of CI.
      - run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: ci
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

  functions:
    name: Typecheck edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Without a deno.json declaring "nodeModulesDir": "none", Deno walks up
      # and tries to resolve the frontend's node_modules.
      - run: deno check supabase/functions/placements/index.ts
